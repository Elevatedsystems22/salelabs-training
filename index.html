<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Virtual Presentation Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: left module rail + main work area; role-play is a 2-column call screen (conversation | presenter tools). */
:root {
  --ink: #0f1b2d;
  --muted: #4f5d73;
  --bg: #f3f6fa;
  --surface: #ffffff;
  --line: #dde3ec;
  --accent: #0b4fb3;
  --accent-soft: #eaf1fc;
  --green: #217a3b;
  --good: #217a3b;
  --good-soft: #e7f4ea;
  --shadow: 0 1px 2px rgba(16,40,80,.04), 0 8px 28px rgba(16,40,80,.07);
  --warn: #8f5200;
  --warn-soft: #fdf1df;
  --bad: #c0392b;
  --bad-soft: #fbe7e4;
  --on-accent: #ffffff;
  --font-display: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e8eef8; --muted: #9aa8bf; --bg: #0b1220; --surface: #121c2e; --line: #22304a; --green: #4cbf62; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.25);
    --accent: #6aa6ff; --accent-soft: #16263f; --good: #4cbf62; --good-soft: #13301d;
    --warn: #f0a640; --warn-soft: #3a2a12; --bad: #ff7b6b; --bad-soft: #3d1c19; --on-accent: #0c1424; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #e8eef8; --muted: #9aa8bf; --bg: #0b1220; --surface: #121c2e; --line: #22304a; --green: #4cbf62; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.25);
  --accent: #6aa6ff; --accent-soft: #16263f; --good: #4cbf62; --good-soft: #13301d;
  --warn: #f0a640; --warn-soft: #3a2a12; --bad: #ff7b6b; --bad-soft: #3d1c19; --on-accent: #0c1424; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; line-height: 1.2; margin: 0; }
h1 { font-size: 30px; font-weight: 800; }
h2 { font-size: 21px; font-weight: 700; }
h3 { font-size: 17px; font-weight: 700; }
p { margin: 0; }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.app { display: grid; grid-template-columns: 280px 1fr; height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { padding: 20px 20px 16px; border-bottom: 1px solid var(--line); }
.brand .name { font-family: var(--font-display); font-weight: 800; font-size: 19px; color: var(--accent); }
.brand .sub { color: var(--muted); font-size: 13px; }
.progress { margin-top: 12px; height: 6px; background: var(--accent-soft); border-radius: 3px; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); transition: width .4s ease; }
.progress-label { font-size: 12px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
.rail nav { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.rail .group { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 14px 10px 6px; }
.navbtn { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; padding: 9px 10px; border-radius: 8px; color: var(--ink); }
.navbtn:hover:not(:disabled) { background: var(--accent-soft); }
.navbtn.active { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.navbtn:disabled { color: var(--muted); cursor: not-allowed; opacity: .7; }
.badge { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; border: 2px solid var(--line); color: var(--muted); font-variant-numeric: tabular-nums; }
.navbtn.done .badge { background: var(--good); border-color: var(--good); color: #fff; }
.navbtn.active .badge { border-color: var(--accent); color: var(--accent); }
.score-chip { font-size: 12px; color: var(--good); font-variant-numeric: tabular-nums; }
.lock { font-size: 12px; color: var(--muted); }
.who { padding: 14px 20px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.linkbtn { background: none; border: 0; color: var(--accent); padding: 0; font-weight: 600; font-size: 13px; }
main { overflow-y: auto; min-height: 0; }
.page { max-width: 820px; margin: 0 auto; padding: 36px 28px 80px; display: flex; flex-direction: column; gap: 20px; }
.eyebrow { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: .04em; text-transform: uppercase; }
.lead { font-size: 18px; color: var(--muted); max-width: 65ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px 24px; display: flex; flex-direction: column; gap: 12px; }
.lesson p, .lesson li { max-width: 68ch; }
.lesson ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.say { border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 14px 18px; border-radius: 0 10px 10px 0; font-size: 16px; }
.say .tag { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
.tip { border-left: 4px solid var(--good); background: var(--good-soft); padding: 12px 16px; border-radius: 0 10px 10px 0; }
.warn { border-left: 4px solid var(--warn); background: var(--warn-soft); padding: 12px 16px; border-radius: 0 10px 10px 0; }
.tip b, .warn b { display: block; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 2px; }
.btn { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 10px; padding: 12px 20px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.secondary { background: var(--surface); color: var(--accent); border: 2px solid var(--accent); }
.btn.danger { background: var(--bad); color: #fff; }
.btn.small { padding: 8px 14px; font-size: 14px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.spread { justify-content: space-between; }
input[type=text], textarea, select { font: inherit; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 11px 14px; width: 100%; }
label { font-weight: 600; font-size: 14px; }
/* Quiz */
.q { display: flex; flex-direction: column; gap: 10px; }
.q .qtext { font-weight: 700; }
.opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 11px 14px; color: var(--ink); width: 100%; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.picked { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt .key { font-weight: 700; color: var(--muted); min-width: 18px; }
.why { font-size: 14px; color: var(--muted); }
.result-banner { border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; gap: 6px; }
.result-banner.pass { background: var(--good-soft); border: 2px solid var(--good); }
.result-banner.fail { background: var(--bad-soft); border: 2px solid var(--bad); }
.result-banner .big { font-family: var(--font-display); font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
/* Families */
.fam-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.fam { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 16px 18px; color: var(--ink); display: flex; flex-direction: column; gap: 6px; }
.fam:hover { border-color: var(--accent); }
.fam .meta { font-size: 13px; color: var(--muted); }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.pill.hard { background: var(--warn-soft); color: var(--warn); }
.pill.pass { background: var(--good-soft); color: var(--good); }
.pill.fail { background: var(--bad-soft); color: var(--bad); }
/* Call screen */
.call { display: grid; grid-template-columns: 1fr 330px; height: 100%; min-height: 0; }
.convo { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
.callbar { padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.callbar .title { font-weight: 700; }
.timer { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.live { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--bad); margin-right: 6px; animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.msgs { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 78%; padding: 10px 14px; border-radius: 14px; }
.msg .spk { font-size: 12px; font-weight: 700; margin-bottom: 2px; }
.msg.agent { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-bottom-right-radius: 4px; }
.msg.agent .spk { color: var(--on-accent); opacity: .8; }
.msg.family { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.family .spk { color: var(--accent); }
.msg.screen { align-self: center; max-width: 90%; background: transparent; color: var(--muted); font-size: 13px; text-align: center; padding: 2px 10px; }
.msg.system { align-self: center; max-width: 90%; background: var(--warn-soft); color: var(--ink); font-size: 14px; text-align: center; }
.typing { color: var(--muted); font-size: 14px; font-style: italic; padding: 0 20px 8px; min-height: 22px; }
.composer { padding: 12px 20px 16px; background: var(--surface); border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-end; }
.composer textarea { resize: none; height: 64px; }
.mic { background: var(--surface); border: 2px solid var(--line); border-radius: 10px; width: 48px; height: 48px; display: grid; place-items: center; color: var(--ink); flex-shrink: 0; }
.mic.on { border-color: var(--bad); color: var(--bad); }
.tools { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; background: var(--bg); min-height: 0; }
.tools h3 { font-size: 14px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.steps { display: flex; flex-direction: column; gap: 4px; }
.stepbtn { text-align: left; background: none; border: 1px solid transparent; border-radius: 8px; padding: 6px 8px; font-size: 14px; color: var(--ink); display: flex; gap: 8px; align-items: center; }
.stepbtn:hover:not(:disabled) { border-color: var(--line); background: var(--accent-soft); }
.stepbtn .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); flex-shrink: 0; }
.stepbtn.shared { color: var(--muted); }
.stepbtn.shared .dot { background: var(--good); border-color: var(--good); }
.stepbtn.current { font-weight: 700; color: var(--accent); }
.quote table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.quote td { padding: 4px 0; border-bottom: 1px solid var(--line); }
.quote td:last-child { text-align: right; font-weight: 700; }
.meter { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.meter > div { height: 100%; transition: width .5s ease, background .5s; }
.small { font-size: 13px; color: var(--muted); }
.btn.small { color: var(--on-accent); }
.btn.small.secondary { color: var(--accent); }
.fam .pill { align-self: flex-start; }
.btn:disabled { background: var(--line); color: var(--muted); border-color: var(--line); opacity: 1; cursor: not-allowed; }
.cheat details { border-top: 1px solid var(--line); padding: 6px 0; font-size: 14px; }
.cheat summary { cursor: pointer; font-weight: 600; }
/* Results */
.cat { display: grid; grid-template-columns: 1fr 70px; gap: 4px 12px; align-items: center; }
.cat .bar { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.cat .bar > div { height: 100%; }
.cat .pts { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.cat .fb { grid-column: 1 / -1; font-size: 14px; color: var(--muted); }
.moment { border-left: 3px solid var(--warn); padding: 6px 12px; display: flex; flex-direction: column; gap: 4px; font-size: 15px; }
.moment .said { color: var(--muted); font-style: italic; }
.hist { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.hist th, .hist td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
.hist th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.modal-back { position: fixed; inset: 0; background: rgba(8,15,30,.55); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal { background: var(--surface); border-radius: 14px; max-width: 520px; width: 100%; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
.menu-toggle { display: none; }
.app.in-call { grid-template-columns: 1fr; grid-template-rows: 1fr; }
.app.in-call .rail { display: none; }

/* ---------- Clean theme overrides ---------- */
h1 { font-size: 32px; font-weight: 800; letter-spacing: -.015em; }
h2 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.rail { border-right: 1px solid var(--line); }
.brand { padding: 22px 20px 18px; border-bottom: 0; }
.brandrow { display: flex; gap: 12px; align-items: center; }
.logo { width: 34px; height: 34px; flex-shrink: 0; }
.brand .name { color: var(--ink); font-size: 16px; font-weight: 800; line-height: 1.2; }
.brand .sub { font-size: 12.5px; }
.progress { height: 5px; background: var(--line); margin-top: 16px; }
.progress > div { background: var(--green); }
.rail nav { padding: 6px 12px 12px; gap: 1px; }
.rail .group { padding: 16px 10px 6px; font-size: 11px; letter-spacing: .08em; }
.navbtn { padding: 8px 10px; border-radius: 10px; font-size: 15px; }
.badge { border-width: 1.5px; width: 24px; height: 24px; }
.navbtn.done .badge { background: var(--green); border-color: var(--green); }
.navbtn.active { background: var(--accent-soft); }
.who { border-top: 1px solid var(--line); }
main { background: var(--bg) url("globe-faint.png") no-repeat right -140px bottom -140px / 560px; background-attachment: fixed; }
.app.in-call main { background: #17191d; }
.page { gap: 22px; padding-top: 44px; }
.eyebrow { color: var(--green); font-size: 12.5px; letter-spacing: .08em; }
.lead { font-size: 17.5px; line-height: 1.6; }
.card { border: 0; box-shadow: var(--shadow); border-radius: 16px; padding: 26px 28px; gap: 14px; }
.say { border-left-width: 3px; border-radius: 0 12px 12px 0; background: var(--accent-soft); }
.tip, .warn { border-left-width: 3px; border-radius: 0 12px 12px 0; }
.btn { border-radius: 999px; padding: 12px 22px; font-weight: 700; }
.btn.secondary { border-width: 1.5px; }
.opt { border-width: 1.5px; border-radius: 12px; }
.fam { border: 0; box-shadow: var(--shadow); border-radius: 16px; outline: 2px solid transparent; transition: outline-color .15s; }
.fam:hover { outline-color: var(--accent); }
.result-banner { border-width: 1.5px; border-radius: 16px; }
input[type=text], textarea, select { border-width: 1.5px; border-radius: 12px; }
.hero-logo { width: 56px; height: 56px; }
.lesson-fig { margin: 4px 0; display: flex; flex-direction: column; gap: 8px; }
.lesson-fig img { width: 100%; height: auto; border-radius: 10px; display: block; box-shadow: 0 1px 2px rgba(16,40,80,.08), 0 4px 16px rgba(16,40,80,.08); }
.lesson-fig .slide { box-shadow: 0 1px 2px rgba(16,40,80,.08), 0 4px 16px rgba(16,40,80,.08); border-radius: 10px; }
.lesson-fig figcaption { font-size: 13px; color: var(--muted); }
.toolcard { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 16px 20px; border-left: 4px solid var(--green); }
.toolcard > div:first-child { display: flex; flex-direction: column; gap: 2px; } .toolcard span { font-size: 14px; color: var(--muted); }
.toolchips { display: flex; gap: 8px; flex-wrap: wrap; }
.mtabs { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; border-bottom: 2px solid var(--line, #dfe5ee); margin: 4px 0 18px; overflow-x: auto; scrollbar-width: none; }
.mtabs::-webkit-scrollbar { display: none; }
.mtabs-main, .mtabs-sub { display: flex; gap: 4px; flex-shrink: 0; }
.mtab { background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -2px; padding: 10px 14px; font: inherit; font-weight: 700; font-size: 15px; color: var(--muted, #5b6575); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.mtab:hover { color: var(--accent); }
.mtab.on { color: var(--accent); border-bottom-color: var(--accent); }
.mtab.sub { font-size: 13px; font-weight: 600; padding: 10px 10px; }
.mtab svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.mhead-act { align-items: center; }
@media (max-width: 900px) {
  .mtabs { gap: 2px; } .mtabs-main, .mtabs-sub { gap: 0; }
  .mtab { padding: 9px 6px; font-size: 13.5px; } .mtab.sub { font-size: 0; gap: 0; padding: 9px 5px; } .mtab.sub svg { width: 19px; height: 19px; }
  .mhead-act { display: flex; flex-wrap: wrap; gap: 8px 14px; width: 100%; }
  .mhead-act .btn { width: auto !important; flex: 0 0 auto; }
  .mhead-act .btn:first-child { flex: 1 1 100%; }
}
.chip { background: var(--accent-soft); color: var(--accent); border: 0; border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 14px; }
.chip:hover { filter: brightness(.96); }
.chip.on { background: var(--accent); color: var(--on-accent); }
.tooldrawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(880px, 54vw); background: var(--surface); box-shadow: -12px 0 40px rgba(10,20,40,.25); z-index: 45; display: flex; flex-direction: column; transform: translateX(105%); transition: transform .25s ease; }
.tooldrawer.open { transform: none; }
.tooldrawer.in-call { width: min(760px, 46vw); }
body.tool-open .app { margin-right: min(880px, 54vw); transition: margin .25s ease; }
body.tool-open.tool-call .app { margin-right: min(760px, 46vw); }
body.tool-open .rail { display: none; } body.tool-open .app { grid-template-columns: 1fr; }
@media (max-width: 1100px) { .tooldrawer, .tooldrawer.in-call { width: 100vw; } body.tool-open .app { margin-right: 0; } }
.td-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--ink); }
.td-step { color: var(--muted); font-size: 14px; } .td-full { margin-left: auto; font-size: 14px; font-weight: 700; color: var(--accent); text-decoration: none; padding: 6px 10px; } .td-full + .td-close { margin-left: 4px; } .td-close { margin-left: auto; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; color: var(--ink); font-weight: 600; }
.tooldrawer iframe { flex: 1; border: 0; width: 100%; background: #fff; }
.phonecard { position: relative; width: min(520px, 100%); aspect-ratio: 4 / 3; border-radius: 18px; background: radial-gradient(circle at 50% 35%, #2c3a52, #161c27 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #fff; border: 3px solid transparent; }
.phonecard.talking { border-color: var(--m-green); }
.pc-avatar { width: 110px; height: 110px; border-radius: 50%; background: #3d5a8a; display: grid; place-items: center; font-size: 40px; font-weight: 800; letter-spacing: .02em; box-shadow: 0 0 0 10px rgba(255,255,255,.05); }
.phonecard.talking .pc-avatar { box-shadow: 0 0 0 10px rgba(60,207,122,.25); }
.pc-name { font-size: 22px; font-weight: 700; } .pc-sub { font-size: 14px; color: #a3aab5; }
.pc-wave { display: flex; gap: 5px; height: 26px; align-items: center; opacity: .25; }
.pc-wave span { width: 5px; height: 8px; border-radius: 3px; background: #3ccf7a; }
.phonecard.talking .pc-wave { opacity: 1; } .phonecard.talking .pc-wave span { animation: wave .9s infinite ease-in-out; }

  /* ================= GETTING STARTED ================= */

  {
    id: "c04", section: "Making the Call", title: "Globe Lapsed Calls", minutes: 3,
    summary: "Former policyholders. Say early that you're not collecting anything: the company is giving them free coverage for having been a policyholder.",
    blocks: [
      { say: "Hey (client), my name is (agent). I'm reaching out because you had some coverage with our parent company, Globe Life. I'm not calling to collect any premiums or anything. In fact, I'm calling because the company is giving you some no-cost coverage for being a former policyholder. This will give you some protection until everything is situated. Was the coverage too expensive, or did you happen to change banks?" },
      { warn: "Lapsed leads expect a bill collector. Make it clear in your first breath that you're not collecting anything." },
      { h: "Their answer, your response" },
      { list: ["<b>Too expensive:</b> “I completely understand. It can be pretty expensive, especially if you have too much or the wrong coverage. The good news is the company is giving you some free benefits at no cost!”", "<b>Changed banks:</b> “I gotcha! That happens all the time. The good news is…”", "<b>Found cheaper insurance:</b> “Well, that's good! The good news is the company is giving you some free benefits that will be in addition to what you already have!”", "<b>Didn't have a policy:</b> “We get that all the time. Usually you had some through work and didn't realize it was Globe Life, or it's been a while and you forgot. Either way…”"] },
      { p: "Each one ends with “Are you married?”, then spouse, kids and bank, the same as Pre-Submit." },
      { tip: "Note why it lapsed. “Too expensive” usually comes back at the close as “I can't afford it,” so keep Option 2 in mind." }
    ],
    quiz: [
      { q: "What must you make clear in the first breath on a lapsed lead?", options: ["You're not calling to collect premiums", "Their policy is reinstated", "They owe a balance", "You're from their bank"], a: 0, why: "They expect a collector." },
      { q: "Which question finds out why it lapsed?", options: ["“Was the coverage too expensive, or did you happen to change banks?”", "“Why didn't you pay?”", "“Do you want it back?”", "“Who's your new insurer?”"], a: 0, why: "It's built into the opening." },
      { q: "They say: “I didn't have a policy with Globe Life.” What's your response?", options: ["It may have been through work, or it's been a while; either way, the free benefits are theirs", "Then end the call", "Insist they did", "Ask for their policy number"], a: 0, why: "Don't argue; move to the free benefits." },
      { q: "They ask: “Is this a debt collector?” What do you say?", options: ["Be absolutely clear: this is NOT a debt collection call and they don't owe anything", "Change the subject", "Say you'll check", "Ask for payment details"], a: 0, why: "Clear and calm, then explain the courtesy coverage." },
      { q: "It lapsed because it was too expensive. What should you expect later?", options: ["“I can't afford it” at the close", "Nothing", "A referral", "A cancellation request"], a: 0, why: "Why it lapsed predicts the objection." }
    ],
    drill: { prompt: "Globe Lapsed lead. Earl Whitaker answers. Give your opening, then respond when he asks: “Is this a bill collector?”", elements: ["Greets Earl by name and says their own name", "Says he had coverage with Globe Life", "Says they're not calling to collect premiums", "Says the company is giving no-cost coverage for being a former policyholder", "Handles the bill-collector question: clearly NOT debt collection, he doesn't owe anything", "Asks a forward question (too expensive or changed banks, or “Are you married?”)"] }

  {

      { q: "Someone reviewed it recently. What do you ask?", options: ["Did they renew your no-cost benefits while they were there?", "Who was it?", "Do you want to cancel?", "Nothing; end the call"], a: 0, why: "The accidental death benefit renews each year." },
      { q: "They ask: “Why do you need to verify?” What's the core of your answer?", options: ["Outdated information could delay benefit payments to their loved ones", "It's a legal requirement", "Our system requires it", "To sell more"], a: 0, why: "Tie it to protecting their family's claim." }

  {
    id: "c06", section: "Making the Call", title: "Phone Rebuttals", minutes: 4,
    summary: "Every phone objection gets the same three moves: acknowledge it, answer it in one breath, then go right back to the script with a question.",
    blocks: [
      { h: "The formula" },
      { list: ["<b>Acknowledge:</b> “Totally get it.” “Makes sense.”", "<b>Answer in one breath.</b> Short. No lecture.", "<b>Ask a forward question:</b> “Are you home now to knock this out?” or “What time are you and your spouse home from work?”"] },
      { h: "“I'm not interested.”" },
      { say: "Totally get it. Just so you know, it's not something you're buying… I'm only reaching out because (sponsor) figured you'd want it too after they claimed theirs. My job is just to deliver it and show you how it works. After that, you decide if it's a fit… Is now a good time for a quick run-through, or is later better for you?" },
      { h: "“I already have insurance.”" },
      { say: "Perfect, I assumed as much… This doesn't compete with or replace what you've got, and it doesn't take long to sign it over to you and explain how it works… Are you home now to knock this out?" },
      { h: "“Not a good time.”" },
      { say: "Makes sense. That's why I'm calling: to get a good time to get this knocked out with you. What time are you and your spouse home from work… later this evening or tomorrow?" },
      { h: "“Wrong number” / “I don't know who that is.”" },
      { say: "Totally get it; this happens sometimes. Someone likely listed your number, maybe by mistake. Either way, the no-cost accidental death policy is tied to this number, so by default it's now yours to claim. It's quick. Are you home now to knock yours out real fast?" },
      { h: "“Why is it free?”" },
      { say: "We get that a lot. It's free to YOU because (sponsor) gifted it to you by being a great client with us. Instead of paying millions of dollars on advertising, we invest in our communities through programs like this… Are you home now to knock yours out?" },
      { tip: "Every rebuttal for every lead type is in your tool. During the call, press <b>O</b>." }
    ],
    quiz: [
      { q: "What are the three moves of every phone rebuttal?", options: ["Acknowledge, answer in one breath, ask a forward question", "Argue, repeat, hang up", "Apologize, explain, email", "Pause, sigh, restart"], a: 0, why: "Keep it short and get back to the script." },
      { q: "“Not a good time.” What's your goal?", options: ["Get a specific time when they and their spouse are home", "Hang up politely", "Talk faster", "Send a text"], a: 0, why: "That's why you're calling: to get a good time." },
      { q: "“I already have insurance.” What's the key point?", options: ["This doesn't compete with or replace what they have", "Cancel the old one", "Ours is cheaper", "Theirs is bad"], a: 0, why: "It's in addition to anything they already have." },
      { q: "“Wrong number.” What do you say about the policy?", options: ["It's tied to this number, so it's now theirs to claim", "Sorry, goodbye", "Give me the right number", "That's impossible"], a: 0, why: "Turn it into an opportunity." },
      { q: "“Why is it free?” What's the answer?", options: ["The sponsor gifted it; we invest in communities instead of millions on advertising", "It's a trial", "There's a hidden fee", "It isn't really free"], a: 0, why: "Gifted, and how the company invests." },
      { q: "How should every rebuttal end?", options: ["With a question that moves the call forward", "With a long explanation", "With an apology", "With silence"], a: 0, why: "Questions keep you in control." }
    ],
    drill: { prompt: "ADP Referral lead (sponsor: Keisha Moore). After your opening, the lead says: “I'm not interested.” Give your rebuttal.", elements: ["Acknowledges the objection (e.g. “Totally get it”)", "Says it's not something they're buying", "Says Keisha figured they'd want it too after she claimed hers", "Says your job is just to deliver it and show how it works", "Ends with a forward question (now or later)"] }
  },
  {
    id: "c07", section: "Making the Call", title: "Start Now or Book It", minutes: 3,
    summary: "If everyone who needs to be there is there, start the presentation now. If not, book a firm time with both spouses and make it stick.",
    blocks: [
      { h: "Start now" },
      { say: "Ok great! Give me one second for my computer to catch up.", tag: "Then go straight into rapport" },
      { p: "No local bank? Still present, and collect referrals." },
      { h: "Book the appointment" },
      { say: "What time will you be home later today for me to give you a call back?", tag: "Give the 2 closest options" },
      { say: "Will your spouse be home as well?", tag: "If married: book when both are home" },
      { say: "What's a good email address for you?", tag: "Have them spell it" },
      { say: "Ok, (client), if I'm booking an appointment with you, then I'm telling another family I'm not available at that time. Are you sure this will be a good time for you?", tag: "The commitment question" },
      { say: "Ok, I'll see you (day and time). Have a great day!" },
      { warn: "Don't hang up without a specific day and time. “Call me sometime” is not an appointment." },
      { tip: "Ask about their evening routine while you book. It builds rapport and helps you pick a time that sticks." }

    quiz: [
      { q: "Married, spouse at work until 6. What do you do?", options: ["Book a time when both are home", "Present to one spouse now", "Call the spouse at work", "Skip the spouse"], a: 0, why: "Both spouses need to be there." },
      { q: "How many time options do you give?", options: ["The 2 closest options", "Let them pick any time", "Just one", "Five"], a: 0, why: "Two close options make it easy to say yes." },
      { q: "Why have them spell their email?", options: ["So it's correct", "To waste time", "For a credit check", "You don't need an email"], a: 0, why: "Get it right the first time." },
      { q: "What's the commitment question?", options: ["“If I'm booking an appointment with you, I'm telling another family I'm not available… Are you sure this will be a good time?”", "“Do you promise?”", "“Can I count on you?”", "There isn't one"], a: 0, why: "It makes the appointment stick." },
      { q: "They have no local bank. Do you still present?", options: ["Yes, still present and collect referrals", "No, end the call", "Only if they open an account", "Only on Zoom"], a: 0, why: "Present anyway and collect referrals." }
    ],
    drill: { prompt: "Tasha can't do it now and her husband Marcus gets home at 6. Book the appointment, from the first booking question to the goodbye.", elements: ["Asks what time they'll be home and gives 2 close time options", "Makes sure Marcus (the spouse) will be home too", "Asks for her email and asks her to spell it", "Asks the commitment question (booking means telling another family you're not available; are you sure it's a good time?)", "Confirms the day and time before hanging up"] }

  {

    blocks: [
      { h: "Zoom appointment" },
      { say: "Hey, (client)? This is (agent) reaching out to you for our (time) appointment to go over (lead type). I just sent over the link for our Zoom meeting. Let me know when you’ve received it." },
      { say: "Go ahead and click that link to join the call. It should allow you to join the meeting from your browser.", tag: "Once they have it" },

      { say: "Hey, (client)? This is (agent) calling for our (time) appointment to go over (lead type). Are you in a good place to talk for about 15 to 20 minutes?" },
      { say: "Perfect! I'll walk you through everything as we go. Stop me anytime you have a question.", tag: "Once they're ready" },
      { h: "Now presentation" },
      { say: "Hey, (client)? This is (agent). I have a few minutes available right now and wanted to reach out about (lead type). Do you have about 15 to 20 minutes to go over this information with me right now?" },
      { say: "No problem at all. When would be a better time for you? I can schedule a proper appointment that works with your schedule.", tag: "If they say no" }

    quiz: [

      { q: "How long do you tell the client the presentation will take?", options: ["5 minutes", "About an hour", "About 15 to 20 minutes", "You don’t mention time"], a: 2, why: "Every opening asks for about 15 to 20 minutes." },
      { q: "On a Now presentation the client says they don’t have time. What’s the right move?", options: ["Push through anyway", "Offer to schedule a proper appointment", "Read the benefits quickly", "Mark the lead dead"], a: 1, why: "Respect their time and book the appointment." },
      { q: "The client says “I clicked it, I think I’m in,” but you can’t see or hear them. What do you do?", options: ["Hang up and wait", "Stay on the phone and help until video and sound work", "Reschedule", "Present by phone only"], a: 1, why: "Never hang up the phone until video and sound are confirmed." },
      { q: "Which line belongs in a Telesales appointment opening?", options: ["“Are you in a good place to talk for about 15 to 20 minutes?”", "“I just sent over the link for our Zoom meeting.”", "“Which option works best for you?”", "“Who’s next?”"], a: 0, why: "The Telesales opening checks they’re in a good place to talk." }
    ],
    drill: { prompt: "Tasha Johnson just picked up for your 6:30 PM Zoom appointment (Pre-Submit lead). Say your opening, word for word as you would on the call.", elements: ["Greets the client by name", "Says their own name", "References the scheduled appointment time", "States what the appointment is for (the lead type / life insurance info)", "Says they sent the Zoom link and asks the client to confirm they received it"] }

  {
    id: "s02t", section: "Presenting by Phone or Zoom", title: "Telesales: Presenting Without a Screen", minutes: 4,
    summary: "On the phone the client can't see a single slide. Your words, your pace and your check-ins carry the whole presentation.",
    blocks: [
      { h: "Paint the picture" },
      { p: "Every slide becomes something you <b>say</b>. Instead of “as you can see here,” describe it: “Final expenses today can run up to $15,000, and Social Security only pays $255.” Your presentation tool switches to Telesales wording when you pick that format." },
      { warn: "Never say “as you can see” or “on your screen” on a Telesales call. It tells the client you're reading a script built for someone else." },
      { h: "Check in often" },
      { list: ["You can't see their face, so ask: “Does that make sense?” about every minute.", "Pause after important numbers. Silence on the phone feels longer than it is, so give them time to answer.", "Use their names, and the details from your F.O.R.M. notes, to keep it personal."] },
      { h: "Say the numbers slowly" },
      { p: "On recaps and at the close, say what they have, what they need, and what you're providing, one number at a time. Then say both monthly premiums clearly and stop talking." },
      { h: "Your voice is your face" },
      { tip: "Smile while you talk; people can hear it. Stand up for the close. Keep the room quiet and your notes in front of you." }
    ],
    quiz: [
      { q: "On a Telesales call, which line should you never say?", options: ["“Does that make sense?”", "“As you can see on your screen…”", "“Why is this benefit important to you?”", "“Which option works best for you?”"], a: 1, why: "Nothing is shared, so describe instead of pointing at a screen." },
      { q: "How often should you check in on a Telesales call?", options: ["Only at the close", "About every minute", "Never; it slows you down", "Once at the start"], a: 1, why: "You can't see their reactions, so ask." },
      { q: "How do you present the Final Expense slide on the phone?", options: ["Tell them to look it up", "Describe it: up to $15,000 today, and Social Security only pays $255", "Skip it", "Email the slide first"], a: 1, why: "Every slide becomes words." },
      { q: "What do you do right after saying both premiums at the close?", options: ["Keep talking to fill the silence", "Stop talking and wait for their answer", "Repeat the benefits", "Offer a discount"], a: 1, why: "Let them answer." },
      { q: "Why pause after important numbers on the phone?", options: ["To give them time to take it in and respond", "To check your email", "It's required by law", "To end the call"], a: 0, why: "They can't re-read a slide, so give the number room." }
    ],
    drill: { prompt: "Telesales call, no screen shared. Explain Income Protection to Tasha out loud, without referring to any slide.", elements: ["Does not refer to a screen or slide (no “as you can see”)", "Explains the family still has bills after the paycheck stops", "Says most families can't afford to lose even one paycheck", "Recommends at least 1 to 2 years of income protection", "Checks understanding (e.g. “Does that make sense?”)"] }
  },

  /* ================= RAPPORT ================= */
  {
    id: "s03", section: "Rapport", title: "Why Rapport Comes First", minutes: 3,
    summary: "The client buys you first, the company second, and the products third. This is where the sale is won or lost.",
    blocks: [
      { say: "The client must buy you first, the company second, and then the products. It cannot go in any other order.", tag: "The rule" },
      { p: "<b>40% of the presentation is rapport.</b> When you get on the call, don’t start closing right away. Go slow." },
      { p: "Spend the first <b>8 to 10 minutes</b> building rapport <b>before</b> you share your screen." },
      { tip: "If the client says something personal, like a recent loss or a new baby, slow down. That moment matters more than staying on schedule." }

      { q: "In what order does a client “buy”?", options: ["Products, company, you", "Company, you, products", "You, the company, then the products", "Price, products, company"], a: 2, why: "You first, the company second, the products third." },

  {
    id: "s04", section: "Rapport", title: "The F.O.R.M. Method", minutes: 4,
    summary: "Family, Occupation, Recreation, Me: four natural topics that build trust and surface referrals.",
    blocks: [
      { list: [
        "<b>Family:</b> “So, are you from this area? Does your family live nearby? What family do you have in this area?” These are referral sources for later.",
        "<b>Occupation:</b> “How long have you been at your job? What exactly do you do there?” People like to talk about their work. Show real interest.",
        "<b>Recreation:</b> “What do you do for fun?” Hobbies give you common ground and more referrals.",
        "<b>Me:</b> Share what you have in common, like the same area, people or hobbies. Share briefly, then hand it back."
      ] },
      { warn: "Don’t make it an interrogation. Ask one question, listen, react to what they actually said, then move naturally to the next." },
      { h: "Take notes while you listen" },
      { p: "Write down names, jobs and hobbies. You’ll use the family names at Referral Collection, and their own words when you ask “Why is this benefit important to you?”" }

    quiz: [
      { q: "What do the letters F.O.R.M. stand for?", options: ["Family, Occupation, Recreation, Me", "Finances, Obligations, Risks, Money", "Family, Opportunity, Referrals, Medical", "Facts, Objections, Rebuttals, Motivation"], a: 0, why: "Family, Occupation, Recreation, Me." },
      { q: "Why does the Family question matter beyond rapport?", options: ["It qualifies them medically", "Family members are potential referral sources", "It tells you their budget", "It’s required by compliance"], a: 1, why: "The family you learn about become referrals later." },
      { q: "Which of these is the biggest rapport mistake?", options: ["Sharing something in common", "Asking about their work", "Firing questions one after another like a form", "Taking notes"], a: 2, why: "Don’t make it an interrogation." },
      { q: "Tasha mentions her mom watches the kids after school. Best response?", options: ["“Great. Let’s look at the screen now.”", "“That’s a blessing. Does she live close by?”", "“How much does that save you?”", "Jump to Occupation"], a: 1, why: "Follow up on what they share, and note her as a future referral." },
      { q: "Which “Me” share builds trust best?", options: ["A five-minute vacation story", "“No way, my son plays Little League too. What position does Jaylen play?”", "Your sales numbers", "Sharing nothing"], a: 1, why: "A brief commonality, then hand the conversation back." },
      { q: "Why take notes during rapport?", options: ["They’re used at referrals and when the client explains why a benefit matters", "Underwriting requires them", "They replace the needs survey", "They don’t matter"], a: 0, why: "Names and details come back later in the presentation." }
    ],
    drill: { prompt: "During rapport, Marcus says: “Yeah, I work at the warehouse over on Halls Mill Road.” Respond the way you would on the call and keep F.O.R.M. going naturally.", elements: ["Reacts genuinely to what he said", "Asks a follow-up Occupation question (how long, what he does there)", "Does not jump to insurance or the presentation", "Sounds conversational, not like a checklist"] }

  document.querySelector(".app").classList.toggle("launch-mode", ["launch", "docs", "first25", "sched", "numbers", "standings"].includes(view.name) && !!store.name);
  renderRail();
  const main = $("#main");
  if (view.name === "cast") { main.innerHTML = castView(); bindCast(); return; }
  if (view.name === "manager") { main.innerHTML = managerView(); afterManagerRender(); main.scrollTop = 0; return; }
  if (!store.name) { main.innerHTML = signInView(); bindSignIn(); return; }
  if (rpl && rpl.phase === "run" && view.name !== "roleplay") { rplStopAudio(); rpl.phase = "setup"; }
  if (od && od.phase === "rep" && view.name !== "objdrill") { objStopAll(); od.phase = "setup"; }
  if (view.name === "launch") { main.innerHTML = launchView(); main.scrollTop = 0; return; }
  if (view.name === "home") main.innerHTML = homeView();
  else if (view.name === "module") main.innerHTML = moduleView(view.id);
  else if (view.name === "quiz") main.innerHTML = quizView(view.id);
  else if (view.name === "drill") { main.innerHTML = drillView(view.id); bindDrill(); }
  else if (view.name === "roleplay") { main.innerHTML = roleplayView(view.id); bindRoleplay(); }
  else if (view.name === "objdrill") { main.innerHTML = objDrillView(view.id); bindObjDrill(); }
  else if (view.name === "zoomsim") { main.innerHTML = zoomSimView(view.id); bindZoomSim(); }
  else if (view.name === "scenario") { main.innerHTML = scenarioView(view.id); bindScenario(); }
  else if (view.name === "practice" || view.name === "exam") main.innerHTML = familyPickView(view.name);
  else if (view.name === "call") { main.innerHTML = callView(); afterCallRender(); return; }
  else if (view.name === "grading") main.innerHTML = gradingView();
  else if (view.name === "results") main.innerHTML = resultsView(view.attempt);
  else if (view.name === "history") main.innerHTML = historyView();
  else if (view.name === "help") main.innerHTML = helpView();
  else if (view.name === "numbers") main.innerHTML = standaloneTop() + numbersView();
  else if (view.name === "docs") main.innerHTML = standaloneTop() + docsView();
  else if (view.name === "first25") main.innerHTML = standaloneTop() + first25View();
  else if (view.name === "sched") main.innerHTML = standaloneTop() + schedView();

}

function scoreRing(total, pass) {
  const C = 314.16, col = pass ? "var(--good)" : total >= PASS_EXAM - 15 ? "var(--warn)" : "var(--bad)";
  return `<svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Score ${total} out of 100"><circle cx="60" cy="60" r="50" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="60" cy="60" r="50" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(total / 100 * C).toFixed(1)} ${C}" transform="rotate(-90 60 60)"/><text x="60" y="66" text-anchor="middle" font-family="Inter, sans-serif" font-size="30" font-weight="700" fill="currentColor">${total}</text></svg>`;
}
function scoreChart(attempts) {
  if (!attempts.length) return `<p class="small">Your last 10 call scores show up here after your first practice call.</p>`;
  const W = 420, H = 170, top = 10, base = 140, bw = 28, gap = (W - 30 - bw * 10) / 9;
  const y = v => base - (v / 100) * (base - top);
  let g = `<line x1="24" x2="${W}" y1="${y(PASS_EXAM)}" y2="${y(PASS_EXAM)}" stroke="var(--good)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="0" y="${y(PASS_EXAM) + 4}" font-size="11" fill="var(--muted)">${PASS_EXAM}</text>`;
  attempts.forEach((a, i) => {
    const x = 30 + i * (bw + gap), last = i === attempts.length - 1;
    g += `<rect x="${x.toFixed(1)}" y="${y(a.total).toFixed(1)}" width="${bw}" height="${(base - y(a.total)).toFixed(1)}" rx="4" fill="${last ? "var(--accent)" : "#b9ccEB"}"><title>${esc(a.family)} · ${fmtLabel(a.format)} · ${a.total}</title></rect>`;
    g += `<text x="${(x + bw / 2).toFixed(1)}" y="${base + 16}" font-size="11" text-anchor="middle" fill="var(--muted)">${a.total}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Last ${attempts.length} call scores: ${attempts.map(a => a.total).join(", ")}. Pass line is ${PASS_EXAM}.">${g}</svg>`;
}

    <div class="row" style="align-items:flex-end;flex-wrap:nowrap">${dictApi ? `<button class="mic" id="drillMic" type="button" aria-label="Speak your answer" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>` : ""}
    <textarea id="drillInput" style="height:140px" placeholder="Say it like you're on the call…">${esc(ds.text)}</textarea></div>

  if (r) {

function bindDrill() {
  const ta = $("#drillInput"); if (!ta) return;
  ta.oninput = () => { drillState.text = ta.value; };
  const mb = $("#drillMic");
  if (mb) mb.onclick = () => {
    if (drillState.listening) { dictApi.stop().catch(() => {}); return; }
    drillState.dictBase = ta.value.trim();
    dictApi.start().catch(err => { if (err && err.code === "not_granted") { mb.remove(); dictApi = null; } });
  };
}
async function checkDrill() {
  const id = drillState.id; const d = DRILLS[id]; const text = ($("#drillInput").value || "").trim();
  drillState.text = text;
  if (text.split(/\s+/).length < 6) { drillState.result = { pass: false, feedback: "That's too short to check. Say the full line the way you would on a call.", items: d.elements.map(e => ({ element: e, hit: false })) }; render(); return; }
  if (dictApi && drillState.listening) { try { await dictApi.stop(); } catch (e) {} }
  drillState.busy = true; render();
  const prompt = `You are checking a new life insurance agent's spoken answer against their agency script. Judge meaning, not exact wording: paraphrases count, but a point that is missing, wrong, or only vaguely implied does NOT count. Be strict on numbers.

SITUATION GIVEN TO THE AGENT: ${d.prompt}

REQUIRED POINTS:
${d.elements.map((e, k) => `${k + 1}. ${e}`).join("\n")}

AGENT'S ANSWER:
"""${text}"""

Output ONLY JSON, no markdown:
{"items":[{"element":"<point text exactly as listed>","hit":true|false,"note":"<if missed or partly wrong: one short tip in script language; else empty>"}],"feedback":"<2 sentences to the agent as 'you': what was strong, what to fix>","critical":"<empty, or a short description if the answer contains a false claim, a promise of approval, or anything non-compliant>"}`;
  try {
    const out = await askClaude(prompt, "default");
    const items = d.elements.map((e, k) => { const x = (out.items || [])[k] || {}; return { element: e, hit: !!x.hit, note: x.note || "" }; });
    const hitN = items.filter(x => x.hit).length;
    const crit = (out.critical || "").trim();
    const pass = hitN >= Math.ceil(d.elements.length * DRILL_PASS) && !crit;
    drillState.result = { pass, items, feedback: (crit ? "Compliance issue: " + crit + ". " : "") + (out.feedback || "") };
    if (!store.drill) store.drill = {};
    const prev = store.drill[id] || {};
    store.drill[id] = { pass: prev.pass || pass, best: Math.max(prev.best || 0, hitN), of: items.length, tries: (prev.tries || 0) + 1 };
    save(); notify("drill_attempt", { module: id, hit: hitN, of: items.length, passed: pass }); checkModuleDone(id);
  } catch (err) {
    drillState.result = { pass: false, feedback: err && err.code === "rate_limited" ? "Too many checks right now. Wait a few seconds and try again." : "The check didn't finish. Your answer is still here; try again.", items: d.elements.map(e => ({ element: e, hit: false })) };
  } finally { drillState.busy = false; render(); }
}

function parseJSON(text) {
  if (!text) throw new Error("empty");
  const s = text.indexOf("{"), e = text.lastIndexOf("}");
  if (s < 0 || e < 0) throw new Error("no json");
  return JSON.parse(text.slice(s, e + 1));
}

    if (t.dataset.go === "objdrill" && od && od.id !== t.dataset.id) od = null;
    if (t.dataset.go === "zoomsim" && zs && zs.id !== t.dataset.id) zs = null;
    if (t.dataset.go === "scenario" && sc && sc.id !== t.dataset.id) sc = null;
    view = { name: t.dataset.go, id: t.dataset.id }; $("#rail").classList.remove("open"); render(); return;
  }
  if (t.dataset.q !== undefined) {
    quizState.picks[+t.dataset.q] = +t.dataset.o;
    t.parentElement.querySelectorAll(".opt").forEach(o => o.classList.toggle("picked", o === t));
    const n = Object.keys(quizState.picks).length; const tot = quizState.items.length;
    $("#submitQuiz").disabled = n !== tot; $("#quizCount").textContent = `${n} of ${tot} answered`; return;
  }
  if (t.id === "submitQuiz") {
    const mid = quizState.id; const items = quizState.items;
    const pct = Math.round(items.filter((q, k) => quizState.picks[k] === q.a).length / items.length * 100);
    store.quiz[mid] = Math.max(store.quiz[mid] || 0, pct);
    if (pct < PASS_QUIZ) { if (!store.reviewLock) store.reviewLock = {}; store.reviewLock[mid] = true; }
    const wasDone = !!(store.doneNotified || {})[mid];
    save(); notify("quiz_attempt", { module: mid, score: pct, passed: pct >= PASS_QUIZ }); checkModuleDone(mid, wasDone); quizState.submitted = true; render(); return;
  }
  if (t.id === "checkDrill") { checkDrill(); return; }
  if (t.id === "retryDrill") { drillState.result = null; drillState.text = ""; render(); const di = $("#drillInput"); if (di) di.focus(); return; }
  if (t.dataset.fam) { startCall(FAMILIES.find(f => f.id === t.dataset.fam), "practice", practiceFormat); return; }
  if (t.dataset.exam) { const pool = FAMILIES.filter(f => callOpen(f, t.dataset.exam)); if (!pool.length) { render(); return; } startCall(pool[Math.floor(Math.random() * pool.length)], "exam", t.dataset.exam); return; }
  if (t.dataset.pformat) { practiceFormat = t.dataset.pformat; render(); return; }
  if (t.dataset.open) { const a = store.attempts.find(x => String(x.id) === t.dataset.open); if (a) { view = { name: "results", attempt: a }; render(); } return; }
  if (t.id === "copyResult") {
    const a = store.attempts.find(x => String(x.id) === t.dataset.att) || view.attempt;
    navigator.clipboard.writeText(resultText(a)).then(() => { $("#copyMsg").textContent = "Copied. Paste it into a text or email to your manager."; }).catch(() => { $("#copyMsg").textContent = "Copy was blocked. Select the scorecard text and copy it manually."; });
  }
});

setTimeout(() => { if (SITE_MODE) initEleven(); }, 1500);
if ((location.hash || "") === "#cast") view = { name: "cast" };
if ((location.hash || "") === "#manager") view = { name: "manager" };
if (WANT_ACADEMY) view = { name: "home" };
if (location.hash && location.hash !== "#cast" && location.hash !== "#manager") { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
/* Certified agents go straight to the live Call Clinic & Presentation (Home on that page brings them back here) */
if (view.name === "launch" && !location.hash && store.name && certified()) { try { const h = document.referrer || ""; if (!/presentation\.html/.test(h)) location.replace(TOOL_URL); } catch (e) {} }
window.addEventListener("hashchange", () => { if (location.hash === "#cast" && view.name !== "call") { view = { name: "cast" }; render(); } });
render();
initCaps();
handleInvite();
</script>
</body>
